services:
  backend:
    build:
      context: ./bckend
      dockerfile: Dockerfile
    image: flatrent-backend:latest
    container_name: flatrent-backend
    ports:
      - "5175:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/flatrental.db

    volumes:
      - backend_uploads:/app/wwwroot/uploads
      - backend_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: flatrent-frontend:latest
    container_name: flatrent-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_data:
