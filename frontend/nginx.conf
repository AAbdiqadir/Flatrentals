server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Missing static files must return 404, not Angular's HTML.
    error_page 404 = @missing_asset;

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # API responses: prevent browser and CDN caching.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
    }

    # Keep uploads outside shared caching initially.
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
    }

    # Angular bundles have content hashes in their filenames.
    location ~* "^/(main|polyfills|chunk|styles)-[a-z0-9]+\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # These filenames may stay the same when content changes.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Always check whether the application HTML has changed.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Angular routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}