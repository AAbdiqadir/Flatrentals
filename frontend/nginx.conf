log_format frontend_timing '$time_iso8601 "$request" status=$status '
                           'bytes=$body_bytes_sent rt=$request_time '
                           'upstream=$upstream_addr urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout frontend_timing;

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular production filenames contain a content hash. Cache only successful
    # responses so a missing chunk never receives a year-long cache lifetime.
    location ~* "^/[^/]+-[a-z0-9]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Assets copied without content hashes must be revalidated after releases.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Missing static files must not receive the Angular HTML fallback.
    location ~* \.(js|css|map|woff2?|ttf|otf|svg|ico|png|jpe?g|gif|webp|avif|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
    client_max_body_size 30m;
}
