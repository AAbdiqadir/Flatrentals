<div class="ledger">
  <a class="ledger-skip" href="#dashboard-content">Skip to content</a>
  <header class="ledger-topbar">
    <div class="ledger-topbar-inner">
      <a [routerLink]="base + '/dashboard'" class="ledger-brand" aria-label="FlatRental dashboard">
        <svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 24V7l9-4 9 4v17M2 24h24M10 24v-6h8v6M10 9h1m6 0h1m-8 5h1m6 0h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>FlatRental<span class="ledger-brand-period">.</span></span>
      </a>
      <nav class="ledger-desktop-nav" aria-label="Dashboard navigation">
        <a [routerLink]="base + '/dashboard'" routerLinkActive="is-active" ariaCurrentWhenActive="page">Overview</a>
        <a [routerLink]="base + '/profile'" routerLinkActive="is-active" ariaCurrentWhenActive="page">My profile</a>
        <a routerLink="/listings">Browse flats <span aria-hidden="true">↗</span></a>
      </nav>
      <div class="ledger-account-nav">
        <span class="ledger-workspace-label">{{ auth.role() }} workspace</span>
        <a [routerLink]="base + '/profile'" class="ledger-avatar ledger-avatar-small" [attr.aria-label]="'Profile for ' + auth.user()?.fullName">{{ initials(auth.user()?.fullName || '') }}</a>
        <button #menuButton type="button" class="ledger-menu-button" [attr.aria-expanded]="menuOpen()" aria-controls="dashboard-mobile-menu" [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'" (click)="menuOpen.set(!menuOpen())">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            @if (menuOpen()) { <path d="m6 6 12 12M6 18 18 6"/> } @else { <path d="M4 7h16M4 12h16M4 17h16"/> }
          </svg>
        </button>
      </div>
    </div>
    <nav id="dashboard-mobile-menu" class="ledger-mobile-nav" aria-label="Mobile dashboard navigation" [hidden]="!menuOpen()">
      <a [routerLink]="base + '/dashboard'" routerLinkActive="is-active" ariaCurrentWhenActive="page">Overview</a>
      <a [routerLink]="base + '/profile'" routerLinkActive="is-active" ariaCurrentWhenActive="page">My profile</a>
      <a routerLink="/listings">Browse flats <span aria-hidden="true">↗</span></a>
      <span>{{ auth.role() }} workspace</span>
    </nav>
  </header>
  <main id="dashboard-content" class="ledger-canvas" tabindex="-1"><router-outlet /></main>
  <footer class="ledger-footer"><span>FlatRental</span><span>Your space, in order.</span></footer>
</div>
