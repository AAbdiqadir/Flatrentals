name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore bckend.sln

      - name: Build backend
        run: dotnet build bckend.sln --configuration Release --no-restore

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build -- --configuration production

  compose:
    name: Validate production Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          APP_VERSION: ci
        run: docker compose --env-file .env.example -f compose.prod.yml config --quiet

  deploy:
    name: Deploy to production VPS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPSHOST }}
      VPS_USER: ${{ secrets.VPSNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.SSHPRIVATEKEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ vars.VPSPORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/flatrentals' }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Deploy and verify
        shell: bash
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            bash -s -- "${{ github.sha }}" "$VPS_DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          commit_sha="$1"
          deploy_path="$2"

          cd "$deploy_path"

          test -f .env
          test -f compose.prod.yml

          git fetch --quiet origin "$commit_sha"
          git checkout --quiet --detach "$commit_sha"

          export APP_VERSION="$commit_sha"

          docker compose --env-file .env -f compose.prod.yml build --pull
          docker compose --env-file .env -f compose.prod.yml up -d --remove-orphans

          for attempt in $(seq 1 12); do
            backend_ready=false
            frontend_ready=false

            if docker compose --env-file .env -f compose.prod.yml exec -T caddy \
              wget -q --spider http://backend:8080/health/ready; then
              backend_ready=true
            fi

            if docker compose --env-file .env -f compose.prod.yml exec -T caddy \
              wget -q --spider http://frontend:80/; then
              frontend_ready=true
            fi

            if [ "$backend_ready" = true ] && [ "$frontend_ready" = true ]; then
              docker compose --env-file .env -f compose.prod.yml ps
              exit 0
            fi

            if [ "$attempt" -eq 12 ]; then
              docker compose --env-file .env -f compose.prod.yml ps
              docker compose --env-file .env -f compose.prod.yml \
                logs --tail=100 backend frontend caddy
              exit 1
            fi

            sleep 5
          done
          REMOTE